services:
  backend:
    build: ./backend
    environment:
      DB_PATH: /data/app.db
      KNOWLEDGE_BASE_PATH: /app/data/knowledge_base.json
      SMALLTALK_PATH: /app/data/smalltalk.json
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      WEATHER_ENABLED: ${WEATHER_ENABLED:-true}
      WEATHER_TIMEOUT: ${WEATHER_TIMEOUT:-5}
      REPLY_DELAY_MIN: ${REPLY_DELAY_MIN:-2}
      REPLY_DELAY_MAX: ${REPLY_DELAY_MAX:-4}
      SPACY_ENABLED: ${SPACY_ENABLED:-true}
      SPACY_MATCHING: ${SPACY_MATCHING:-true}
      SPACY_MODEL: ${SPACY_MODEL:-ru_core_news_sm}
    volumes:
      - chatbot-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  bot:
    build: ./backend
    command: ["python", "-m", "app.telegram_bot"]
    environment:
      DB_PATH: /data/app.db
      KNOWLEDGE_BASE_PATH: /app/data/knowledge_base.json
      SMALLTALK_PATH: /app/data/smalltalk.json
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WEATHER_ENABLED: ${WEATHER_ENABLED:-true}
      WEATHER_TIMEOUT: ${WEATHER_TIMEOUT:-5}
      REPLY_DELAY_MIN: ${REPLY_DELAY_MIN:-2}
      REPLY_DELAY_MAX: ${REPLY_DELAY_MAX:-4}
      SPACY_ENABLED: ${SPACY_ENABLED:-true}
      SPACY_MATCHING: ${SPACY_MATCHING:-true}
      SPACY_MODEL: ${SPACY_MODEL:-ru_core_news_sm}
    volumes:
      - chatbot-data:/data
    profiles:
      - bot

volumes:
  chatbot-data:
